spring:
  datasource:
    url: jdbc:h2:mem:connectly;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: validate

  mail:
    host: ""

app:
  cors:
    allowed-origins: http://localhost:5173
  jwt:
    secret: test-secret-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    access-ttl-seconds: 900
    refresh-ttl-seconds: 1209600
    mfa-ttl-seconds: 300
  login:
    max-failed-attempts: 5
    lock-minutes: 15
  rate-limit:
    login: 100/60
    register: 100/300
    forgot-password: 100/3600
    reset-password: 100/3600
    verify-email: 100/300
  mail:
    mode: log
    from: test@connectly.local
  oauth:
    google:
      enabled: false
