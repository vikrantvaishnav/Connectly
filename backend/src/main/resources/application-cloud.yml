# Cloud profile: external MySQL (e.g. Aiven free tier) with TLS required.
# Credentials come from the environment, loaded from the git-ignored .env
# by backend/scripts/run-cloud.sh. Never hardcode them here.
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:defaultdb}?sslMode=${DB_SSL_MODE:REQUIRED}${DB_EXTRA_URL_PARAMS:}&connectTimeout=10000&socketTimeout=60000&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5        # free-tier friendly (1 GB RAM instances)
      minimum-idle: 1
      connection-timeout: 15000
      max-lifetime: 300000        # recycle connections before cloud proxies kill idle ones

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

# NOTE: relaxed limits for personal/demo cloud deployments and the seed script.
# Tighten to the production values from application.yml before public launch.
app:
  rate-limit:
    login: 100/60
    register: 100/300
    forgot-password: 100/3600
    reset-password: 100/3600
    verify-email: 100/300
