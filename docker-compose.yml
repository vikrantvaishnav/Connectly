services:
  mysql:
    image: mysql:8.4
    container_name: connectly-mysql
    environment:
      MYSQL_DATABASE: ${DB_NAME:-connectly}
      MYSQL_USER: ${DB_USERNAME:-connectly}
      MYSQL_PASSWORD: ${DB_PASSWORD:-connectly}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: connectly-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    container_name: connectly-backend
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-connectly}
      DB_USERNAME: ${DB_USERNAME:-connectly}
      DB_PASSWORD: ${DB_PASSWORD:-connectly}
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: connectly-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mysql_data:
