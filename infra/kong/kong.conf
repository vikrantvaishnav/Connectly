# Kong Gateway (DB-less) configuration for Connectly
database: off
declarative_config: /kong/declarative/kong.yml

proxy_listen: 0.0.0.0:8000 reuseport backlog=16384, 0.0.0.0:8443 http2 ssl reuseport backlog=16384
admin_listen: 0.0.0.0:8001 reuseport backlog=16384

# Logging
proxy_access_log: /dev/stdout
proxy_error_log: /dev/stderr
admin_access_log: /dev/stdout
admin_error_log: /dev/stderr
log_level: notice

# Never publish 8001; keep the admin surface local-only inside the compose network.
nginx_user: kong kong

# Large headers for JWT-bearing requests
nginx_http_max_headers: 100
